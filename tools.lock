# tools.lock: every file install.sh downloads, pinned by sha256.
# One row per file; columns are separated by spaces; "-" means empty.
#
#   name     tool name (bin/gz rows: also the command name in ~/.local/bin)
#   version  release tag (ts-parser and git rows: the pinned commit)
#   tier     lowest install tier that needs the row (notes, then dev)
#   os       linux | darwin | any
#   arch     x86_64 | aarch64 | any
#   kind     tar       archive unpacked into ~/.local/opt/<name>-<version>
#            bin       single executable
#            gz        gzip-compressed single executable
#            font      font archive; the files= pattern goes to ~/.local/share/fonts
#            spell     Vim spell file for stdpath('data')/site/spell
#            ts-parser grammar source tarball, built with tree-sitter build
#            git       repository checked out at the pinned commit
#   url      https download (git rows: the repository)
#   sha256   sha256 of the downloaded file (git rows: -)
#   verify   how the sha256 was established (re-checked by scripts/lock-refresh.sh):
#            digest    GitHub release asset digest; the vendor publishes no checksum
#            checksum  digest, and it matches the vendor's checksum file
#            attest    digest, and an attestation verified: gh attestation verify
#                      (build provenance) or gh release verify-asset (immutable release)
#            tofu      no upstream checksum; hash pinned at first download
#                      (spell: two mirrors agreed; ts-parser: GitHub archive tarball)
#            git       pinned commit, checked out by sha
#   extra    kind-specific settings, key=value separated by ";":
#            bin=<path in archive>   executable to link into ~/.local/bin (same name)
#            icu=wrap                start through a wrapper when libicu is missing
#            glibc=<x.y>             skip the row when glibc is older
#            needs=<cmd>             skip the row when the command is missing
#            files=<glob>            files to unpack (font rows)
#            location=<dir>          grammar subdirectory (ts-parser rows)
#
# Linux only: nvim, rg, fd, fzf, marksman, yq, gitleaks, tree-sitter and the font
# (the Mac gets these from the Brewfile). Every os=any row is used on both machines.
# ts-parser rows come from lua/nvim-treesitter/parsers.lua at the nvim-treesitter
# revision in nvim/nvim-pack-lock.json; grammars that need "tree-sitter generate"
# are refused.
#
# name version tier os arch kind url sha256 verify extra
