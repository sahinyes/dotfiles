# ============================================================================
#  tmux.conf, shared by the Mac (iTerm2) and the Debian laptop (GNOME Terminal)
#  tmux 3.3+ | install.sh links ~/.tmux.conf here and ~/.tmux/scripts to ./scripts
#
#  Swiss German keyboard on both machines:
#    iTerm2 has BOTH Option keys = Normal, so Option+5/6/7/8/9 type [ ] | { }.
#    tmux therefore never sees Option+letter as Meta. Option+arrow still
#    arrives as Alt+arrow (iTerm2 "Treat Option as Alt for special keys",
#    on by default; GNOME Terminal sends Alt+arrow as is), so pane switching
#    with Option/Alt+arrow works without the prefix.
#    Splits use prefix+v / prefix+- because | needs Option+7.
#
#  Prefix: Ctrl+a (Neovim therefore never receives <C-a>)
#  Cheat sheet: prefix + F1
# ============================================================================

# ── General ─────────────────────────────────────────────────────────────────
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB,alacritty:RGB"
set  -g history-limit 50000
set  -g buffer-limit 20
set  -g display-time 2000
set  -g display-panes-time 2000
set  -g status-interval 5
set  -g focus-events on                            # Neovim autoread/autosave on focus
set  -s escape-time 10                             # 10ms: safe for SSH, imperceptible
set  -s extended-keys off                          # legacy keys; the Neovim keymap avoids chords that need more
set  -g mouse on
set  -g renumber-windows on
set  -g base-index 1
set  -g pane-base-index 1
set  -g set-titles on
set  -g set-titles-string "#S / #W"

# Clipboard: tmux's own copy mode may set the terminal clipboard, programs in
# a pane may not. `external` ignores OSC 52 sent by pane output, so a hostile
# log line printed by curl/cat cannot overwrite the clipboard. No passthrough
# either, otherwise a pane could wrap OSC 52 and send it past tmux.
set  -s set-clipboard external
setw -g allow-passthrough off

# GNOME Terminal (VTE) draws curly underlines, but tmux cannot detect that.
# Declare it so Neovim's spell/diagnostic undercurl survives inside tmux.
if-shell '[ -n "$VTE_VERSION" ]' 'set -as terminal-features ",xterm-256color:usstyle"'

# ── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix                               # C-a C-a sends literal C-a

# Nested tmux (ssh -> tmux): use C-a C-a to send prefix to inner session
# Do NOT bind C-s globally — it conflicts with terminal XOFF and editor save

# ── Reload ──────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Splits ──────────────────────────────────────────────────────────────────
# CH-DE: | requires Option+7 so 'v' is the primary vertical split key
bind v split-window -h -c "#{pane_current_path}"   # Vertical (left/right)
bind | split-window -h -c "#{pane_current_path}"   # Alias for US keyboards
bind - split-window -v -c "#{pane_current_path}"   # Horizontal (top/bottom)
bind _ split-window -v -c "#{pane_current_path}"   # Shift+- alias
unbind '"'
unbind %
# NOTE: 's' left as default (choose-tree session picker)
# NOTE: 'w' left as default (choose-tree window picker)

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ── Pane Navigation (vim-style) ────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Option+arrow (iTerm2) / Alt+arrow (GNOME Terminal), no prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Pane Resizing (repeatable with -r) ─────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window Navigation ──────────────────────────────────────────────────────
# prefix+number is built-in — no rebind needed
# NO Alt+number bindings: CH-DE uses Option+number for @|~[]{}# characters

# Shift+arrow — works on all keyboards, no prefix needed
bind -n S-Left  previous-window
bind -n S-Right next-window

# Swap window order
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# ── Session Management ──────────────────────────────────────────────────────
bind S choose-session                              # Quick session picker
bind N command-prompt -p "New session:" "new-session -s '%%'"
bind X confirm-before -p "Kill session? (y/n)" kill-session
# NOTE: prefix+s (choose-tree) and prefix+w (window tree) are built-in

# ── Kill / Close (CH-DE friendly — no '&' needed) ──────────────────────────
bind x confirm-before -p "Kill pane? (y/n)"   kill-pane     # prefix+x
bind Q confirm-before -p "Kill window? (y/n)" kill-window   # prefix+Q (replaces &)
# X above = kill-session

# sesh — fuzzy project/session jumper (zoxide + fzf). prefix+T
# Only bound where sesh and fzf-tmux exist (the laptop may have neither).
# ^a all  ^t tmux  ^g configs  ^x zoxide  ^f find-dir  ^d kill-session
if-shell 'command -v sesh >/dev/null 2>&1 && command -v fzf-tmux >/dev/null 2>&1' {
  bind T run-shell "sesh connect \"$(
    sesh list --icons | fzf-tmux -p 80%,70% \
      --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
      --header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^f find  ^d kill' \
      --bind 'tab:down,btab:up' \
      --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
      --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
      --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
      --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
      --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 3 -t d -E .git . ~)' \
      --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)'
  )\""
}

# ── Copy Mode (vi) ─────────────────────────────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# y / mouse drag copy to the system clipboard. copy-pipe without an argument
# pipes to copy-command, chosen below from what this machine has:
# pbcopy (Mac) -> wl-copy (Wayland) -> xclip (X11). With none of them the
# text still lands in a tmux buffer (prefix + ] pastes it).
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
if-shell 'command -v pbcopy >/dev/null 2>&1' {
  set -s copy-command 'pbcopy'
} {
  if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' {
    set -s copy-command 'wl-copy'
  } {
    if-shell '[ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' {
      set -s copy-command 'xclip -selection clipboard'
    }
  }
}

# Search in scrollback
bind / copy-mode \; send-key /

# ── Pane Utilities ──────────────────────────────────────────────────────────
bind a setw synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"
bind W display-panes \; command-prompt -p "Swap with:" "swap-pane -t '%%'"
bind B break-pane
bind M command-prompt -p "Join pane from:" "join-pane -s '%%'"
bind z resize-pane -Z
bind R respawn-pane -k \; display "Pane respawned"

# ── Layouts ─────────────────────────────────────────────────────────────────
bind = select-layout even-horizontal
bind + select-layout even-vertical
bind Space next-layout

# ── Theme: Nord-Inspired Minimal ───────────────────────────────────────────

NORD0="#2E3440"
NORD1="#3B4252"
NORD3="#4C566A"
# Lower case: inside a status format tmux 3.3 reads "#D" as the pane id.
NORD4="#d8dee9"
NORD8="#88C0D0"
NORD9="#81A1C1"
NORD13="#EBCB8B"
NORD14="#A3BE8C"

# Status bar
set  -g status-position bottom
set  -g status-justify left
set  -g status-style "bg=$NORD0,fg=$NORD4"
set  -g status-left-length 60
set  -g status-right-length 160

# Left: session | sync indicator | pane count
# While ssh-colors.sh runs ssh in the active pane, its host label and color
# (pane options @ssh_label, @ssh_color) replace the session name.
set  -g status-left "\
#{?@ssh_label,\
#[bg=#{@ssh_color}#,fg=$NORD0#,bold] #{@ssh_label} #[bg=$NORD0#,fg=#{@ssh_color}#,nobold],\
#[bg=$NORD9#,fg=$NORD0#,bold]  #S #[bg=$NORD0#,fg=$NORD9#,nobold]}\
#{?synchronize-panes,#[bg=$NORD13#,fg=$NORD0#,bold] SYNC #[bg=$NORD0#,fg=$NORD13#,nobold],}\
#[fg=$NORD3] P:#{window_panes} "

S="~/.tmux/scripts/status.sh"

# Right: claude | git | cpu | ram | net | host | uptime | time | date
# Built piece by piece so segments whose tool is missing are simply left out.
# status.sh itself prints nothing when a macOS/Linux tool is absent.
set  -g status-right ""
if-shell 'command -v python3 >/dev/null 2>&1' {
  set -ga status-right "#($S claude)"
}
# git gets the pane id (%N), so every client shows the branch of its own
# active pane. Never put #{pane_current_path} itself into #(): a directory
# name with a newline in it would run as a second shell command.
if-shell 'command -v git >/dev/null 2>&1' {
  set -ga status-right "#[fg=$NORD14]#($S git #{pane_id}) "
}
set -ga status-right "\
#[fg=$NORD3]#[bg=$NORD3,fg=$NORD4]  #($S cpu) \
#[fg=$NORD1]#[bg=$NORD1,fg=$NORD8]  #($S ram) \
#[fg=$NORD3]#[bg=$NORD3,fg=$NORD4] #($S net) \
#[fg=$NORD3]#[bg=$NORD3,fg=$NORD4]  #H \
#[fg=$NORD1]#[bg=$NORD1,fg=$NORD4]  #($S uptime) \
#[fg=$NORD13]#[bg=$NORD1,fg=$NORD13] %H:%M \
#[fg=$NORD9]#[bg=$NORD9,fg=$NORD0,bold] %d-%b "

# Window tabs — colors come from window-status-style (per-window overridable)
setw -g window-status-style "bg=$NORD1,fg=$NORD4"
set  -g window-status-format " #I:#W "
setw -g window-status-current-style "bg=$NORD9,fg=$NORD0,bold"
set  -g window-status-current-format " #I:#W#{?window_zoomed_flag, Z,} "
set  -g window-status-separator "#[bg=$NORD0] "

# Pane borders
set  -g pane-border-style "fg=$NORD3"
set  -g pane-active-border-style "fg=$NORD8"

# Messages
set  -g message-style "bg=$NORD1,fg=$NORD14,bold"
set  -g message-command-style "bg=$NORD1,fg=$NORD4"

# Copy mode highlight
setw -g mode-style "bg=$NORD9,fg=$NORD0"

# Clock
setw -g clock-mode-colour "$NORD8"
setw -g clock-mode-style 24

# Activity
set  -g visual-bell off
set  -g bell-action none
set  -g visual-activity off
setw -g monitor-activity on
set  -g window-status-activity-style "fg=$NORD13,bold"

# Popup border
set  -g popup-border-style "fg=$NORD8"

# ── Auto-rename ─────────────────────────────────────────────────────────────
setw -g automatic-rename on
# SSH: show the title the remote shell sets, local: show "dir".
# q/h doubles every #, so a title or directory name like "#[bg=red]" shows
# as text instead of styling the tab (the remote host sets the title).
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},ssh},#{q/h:pane_title},#{b;q/h:pane_current_path}}"

# ── Cheat Sheet (prefix + F1) ──────────────────────────────────────────────
bind F1 display-popup -w 72 -h 40 -E "\
  echo '  TMUX CHEAT SHEET (CH-DE friendly)';\
  echo '  ──────────────────────────────────────';\
  echo '  PREFIX = Ctrl+a';\
  echo '';\
  echo '  SPLITS';\
  echo '    v          Split vertical  (left/right)';\
  echo '    -          Split horizontal (top/bottom)';\
  echo '';\
  echo '  PANES';\
  echo '    h/j/k/l    Move between panes (vim)';\
  echo '    H/J/K/L    Resize panes (5 cells)';\
  echo '    Option+arrows  Move between panes (no prefix)';\
  echo '    z           Zoom/unzoom pane';\
  echo '    a           Sync panes toggle';\
  echo '    W           Swap panes by number';\
  echo '    x           Kill pane';\
  echo '';\
  echo '  WINDOWS & SESSIONS';\
  echo '    c           New window';\
  echo '    1-9         Jump to window (prefix+number)';\
  echo '    Shift+L/R   Prev/Next window (no prefix)';\
  echo '    < / >       Reorder windows';\
  echo '    w           Window tree picker (built-in)';\
  echo '    s           Session tree picker (built-in)';\
  echo '    S           Quick session list';\
  echo '    N           New session';\
  echo '    T           sesh: fuzzy project/session jumper (if installed)';\
  echo '    Q           Kill window  (replaces &)';\
  echo '    X           Kill session';\
  echo '    Ctrl+s / Ctrl+r  Save / restore sessions (resurrect)';\
  echo '';\
  echo '  COPY MODE';\
  echo '    Enter       Enter copy mode (vi keys)';\
  echo '    /           Search in scrollback';\
  echo '    v/V/y       Select / line-select / yank to clipboard';\
  echo '';\
  echo '  Press Enter to close...';\
  read -r _"

# ── Session save/restore (tmux-resurrect + tmux-continuum) ─────────────────
# No tpm: install.sh clones both plugins at pinned revisions, so nothing in
# here can fetch new plugin code (no prefix+I / prefix+U). A missing plugin
# is skipped. Manual: prefix + Ctrl-s = save, prefix + Ctrl-r = restore.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Saved pane text is written to disk in plain text (tokens, cookies,
# payloads). Keep it on the Mac, never on the work laptop, which install.sh
# marks with ~/.config/dotfiles/work.
set -g @resurrect-capture-pane-contents 'on'
if-shell '[ -e "$HOME/.config/dotfiles/work" ]' {
  set -g @resurrect-capture-pane-contents 'off'
}

# continuum: auto-save every 15 min (auto-restore OFF — was reopening the same
# panes/scrollback on every tmux start; restore manually with prefix + Ctrl-r)
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Load last: continuum hooks its auto-save into status-right set above.
# The save dir is private (0700) because it holds layouts and pane text.
# Every save also records the command line of each running program (e.g.
# curl -H 'Authorization: ...'), so the work laptop gets no automatic
# saves: no continuum there, prefix + Ctrl-s still saves by hand.
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' {
  run-shell 'mkdir -p ~/.local/share/tmux/resurrect && chmod 700 ~/.local/share/tmux/resurrect'
  run-shell '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
  if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ] && [ ! -e "$HOME/.config/dotfiles/work" ]' {
    run-shell '~/.tmux/plugins/tmux-continuum/continuum.tmux'
  }
}
